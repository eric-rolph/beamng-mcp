name: GIS maps release

# Rebuilds the six levels from public data on a GitHub runner and attaches the ZIPs
# (plus SHA256SUMS.txt and the release locks) to a GitHub Release, so a play-test
# install is a download rather than a build. Whole ZIPs run from about 90 MB to the
# 426 MB of Black Bear Pass, over the
# session file-delivery limit, and release assets are the one place they can live
# without bloating the repository.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update"
        required: true
        default: "gis-maps-v1"
      maps:
        description: "Space-separated map keys (empty = all)"
        required: false
        default: ""
  push:
    tags:
      - "gis-maps-v*"
    # Branch pushes run the workflow file AT THE PUSHED COMMIT, which is the only trigger
    # available before this file reaches the default branch (workflow_dispatch resolves
    # against the default branch).
    #
    # A branch matched here spends 36 minutes of a runner on a six-map build, so this list
    # is an opt-in: name a branch claude/gis-maps-build-<topic> when the build IS the point
    # of the push, and keep every other PR branch out. Anything else is validated by
    # ci.yml, which runs on the pull request in about two minutes.
    #
    # It used to cost more than runner time. Every branch here shared ONE repository-wide
    # concurrency group, and GitHub keeps a single pending run per group: a new run
    # REPLACES the one waiting rather than queueing behind it. So a push on any branch
    # silently discarded a six-map build somebody else was waiting on - four of them in
    # one afternoon, one by a pure-Python change that needed no runner at all. The group
    # below is keyed on the publish CONDITION now, which unloads that gun for the branches
    # named here - each gets a group of its own and waits for nobody.
    #
    # IT IS STILL LOADED FOR claude/gis-maps-pack, which is the case that matters most.
    # That branch satisfies the publish condition, so its key is the CONSTANT
    # gis-maps-release-publish: two pushes to it still share one group and the newer
    # waiter still discards the older. Runs 43 through 50 died that way under the old
    # repository-wide key, and runs 56, 57, 58 and 60 died the same way AFTER this
    # re-keying landed - so do not read the new key as protecting this branch. A batch of
    # pull requests merged one at a time evicts its own queued build on every merge, so if
    # a build has to finish, merges to that branch have to stop for the ~40 minutes it
    # takes.
    #
    # What is left for the branches above is the runner time, which is reason enough to
    # stay out.
    #
    # WHAT THAT VALIDATION DOES NOT COVER, because it will mislead you otherwise: ci.yml
    # runs on windows-latest and never builds a map, so `require_built` skips every
    # artefact gate in tests/test_gis_maps_pack.py there. The gates that read a built
    # level - the handoff hashes, the .ter binary, the colour and refill contracts, the
    # spawn checks - run ONLY on a build runner, which means this workflow's "Static gates
    # on the built trees" step and a critic round. A pull request can therefore be green
    # on all four checks while the branch it targets is red on a gate no pull request can
    # see, and on 2026-09-18 three of them were. Green here is evidence about the static
    # suite, never about the maps.
    branches:
      - "claude/gis-maps-pack"
      - "claude/gis-maps-build-**"

permissions:
  contents: write

# Every run ends in `gh release upload <tag> --clobber` against the SAME release, and
# nothing else serialises them. Two runs in flight together interleave their assets, so
# the release can finish holding ZIPs from one commit and a SHA256SUMS.txt from another
# with no field saying so.
#
# Two things need serialising here and they are not the same shape, which is why one flat
# key could not do it. A bare ${{ github.ref }} was rejected for a real reason - THREE
# disjoint paths publish (a gis-maps-v* tag, a workflow_dispatch on any ref, and a push to
# the integration branch), they carry three different refs, and keying on the ref would
# put them in three groups and let them clobber one release at once. That reasoning was
# right. Dropping the ref entirely was the wrong conclusion from it.
#
# A BUILD IS PER BRANCH. Two branches building six maps share nothing at all.
#
# Repository-wide made every build queue for the release's slot. A group holds one RUNNING
# run and exactly one WAITING run, and a third arrival discards the waiter - it does not
# queue behind it. That sentence is what four builds died of on 2026-09-18, and it is not
# obvious from the documentation. A push on any branch threw away another branch's
# waiting build. cancel-in-progress does
# not enter into it - it governs the RUNNING run, and what was lost was the PENDING one.
# Setting it false was correct on its own merits and could never have fixed this.
#
# So key on the publish CONDITION, not on the branch: every publishing path collapses to
# one group and keeps the release serialised, while every other ref gets a group of its
# own and waits for nobody. The condition is repeated on the two release steps below, and
# the three have to agree - change them together.
#
# The condition is now a function of github.ref ALONE. It used to include
# `github.event_name == 'workflow_dispatch'`, which let a manual run publish from ANY ref:
# the group stopped two runs racing but nothing stopped somebody dispatching a stale
# branch and overwriting the release with older maps, which is the failure the publish
# gate was added to prevent. A dispatch carries the ref it was launched from, so dropping
# that clause says what we actually mean - publish from the integration branch or a tag,
# and from anywhere else build, gate and upload nothing. Dispatching elsewhere is still
# useful: it is how you put a branch's maps through the gates without touching a release.
#
# cancel-in-progress stays false. Several sessions work the integration branch at once,
# and a 36-minute build is worth more than the seconds killing it would save. Inside a
# group a newer push still supersedes the pending run, which is what you want: the queue
# never grows past one and the newest commit wins.
concurrency:
  group: >-
    gis-maps-release-${{ (startsWith(github.ref, 'refs/tags/')
    || github.ref == 'refs/heads/claude/gis-maps-pack')
    && 'publish' || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # Black Bear Pass is 4096 samples over 8192 m (2 m per sample: the de-lighting is
    # OOM-killed at 8192 samples, see AGENTS.md). Its point cloud is read at the full
    # 8192 m footprint whatever the sample count - 10,755 octree nodes, about 2.35 GB
    # of LAZ - so it still dominates the job; the six together took 26 minutes before
    # this map grew to the whole box canyon.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install the pack's dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -c "import rasterio; print('GDAL', rasterio.__gdal_version__)"
          df -h / | tail -1

      - name: Build every map (fetch -> terrain -> level -> dist -> ledger)
        env:
          MAPS: ${{ github.event.inputs.maps }}
        run: |
          # Actions runs a `run:` step as `bash -e {0}`, so -e is already on when this
          # line is reached and `set -uo pipefail` does NOT clear it. Without the +e the
          # shell exits on the failing build pipeline and the annotation below never
          # runs, which is exactly what happened on 4037639.
          set +e
          set -uo pipefail
          MAPS="${MAPS:-}"
          build() {
            if [ -z "$MAPS" ]; then
              python examples/gis_maps/build.py --all all
            else
              for key in $MAPS; do python examples/gis_maps/build.py "$key" all; done
            fi
          }
          # On a failure the tail of the build is raised as a check annotation, because
          # the sessions that drive this branch cannot read an Actions log. See
          # .github/scripts/build_failure_annotation.py.
          build 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { echo "--- exit status $status"; free -m; df -h / | tail -1; } > /tmp/build.env
            python3 .github/scripts/build_failure_annotation.py \
              "$status" /tmp/build.log /tmp/build.env
            exit "$status"
          fi
          du -sh examples/gis_maps/*/dist
          df -h / | tail -1

      # The only place most of this suite actually runs. ci.yml is windows-latest with no
      # build, so every gate behind `require_built` skips there; a pull request cannot go
      # red on any of them. Read a failure here as the first real word on the maps.
      #
      # Which is why a bare pytest here was the worst place to be unreadable: the log
      # endpoint redirects to blob storage the sessions' egress denies, the logs artifact
      # lives on the same host, and a check run for an Actions job carries no output text
      # - so run 41 said "Process completed with exit code 1" and nothing else, on the one
      # step that tests the maps. Annotate it the way the build step is annotated, with
      # --pytest so the assertion is what gets raised rather than the tail, which under
      # -q is a hundred-odd SKIPPED reasons and never the failure.
      - name: Static gates on the built trees
        run: |
          set +e
          set -uo pipefail
          python -m pytest -q -ra --tb=short tests/test_gis_maps_pack.py 2>&1 | tee /tmp/gates.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "--- stage: static gates on the built trees" > /tmp/gates.env
            python3 .github/scripts/build_failure_annotation.py \
              "$status" /tmp/gates.log /tmp/gates.env --pytest
            exit "$status"
          fi

      # Publishing is for tags, manual runs, and the pack's own integration branch. Every
      # branch matching the trigger still builds all six maps and runs the gates above -
      # that is the CI value and it is unchanged - but only claude/gis-maps-pack rewrites
      # the shared release.
      #
      # Before this, a push to ANY claude/gis-maps** branch published to gis-maps-v1, so a
      # side branch mid-experiment replaced the installable ZIPs and nothing in the release
      # recorded which branch they came from. Narrowing it to the integration branch keeps
      # the property that matters - work that reaches claude/gis-maps-pack refreshes the
      # download with no extra step - while a work-in-progress branch can no longer take
      # the release over. To publish from anywhere else, run this workflow from the
      # Actions tab.
      - name: Collect release assets
        # WHO MAY PUBLISH is the ref, and only the ref. A manual dispatch carries the ref it
        # was launched from, so dispatching from the integration branch or a tag publishes
        # and dispatching from anywhere else builds, gates and uploads nothing. Keep this
        # identical to the concurrency group's condition above.
        if: ${{ startsWith(github.ref, 'refs/tags/')
          || github.ref == 'refs/heads/claude/gis-maps-pack' }}
        env:
          TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'gis-maps-v1' }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp examples/gis_maps/*/dist/*_ericrolph.zip release/
          cp examples/gis_maps/*/dist/*.lock.json release/
          cp examples/gis_maps/*/authoring/*.handoff.json release/
          (cd release && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          {
            echo "Six BeamNG.drive levels built from public GIS data (USGS 3DEP, OpenTopography NCALM/B4 lidar, USGS NAIP imagery, OpenStreetMap roads)."
            echo
            echo "Install: drop the *_ericrolph.zip files into %LOCALAPPDATA%\\BeamNG\\BeamNG.drive\\current\\mods\\ (or run python examples/gis_maps/install_local.py --release $TAG from the repository). Verify with SHA256SUMS.txt."
            echo
            echo "Built from commit ${{ github.sha }} by workflow run ${{ github.run_id }}."
            echo
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
          } > release/NOTES.md

      - name: Create or update the GitHub Release
        # WHO MAY PUBLISH is the ref, and only the ref. A manual dispatch carries the ref it
        # was launched from, so dispatching from the integration branch or a tag publishes
        # and dispatching from anywhere else builds, gates and uploads nothing. Keep this
        # identical to the concurrency group's condition above.
        if: ${{ startsWith(github.ref, 'refs/tags/')
          || github.ref == 'refs/heads/claude/gis-maps-pack' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'gis-maps-v1' }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.zip release/*.json release/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file release/NOTES.md
          else
            gh release create "$TAG" release/*.zip release/*.json release/SHA256SUMS.txt \
              --target "${{ github.sha }}" --prerelease \
              --title "GIS maps pack ($TAG)" --notes-file release/NOTES.md
          fi
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)\t\(.size)"'
