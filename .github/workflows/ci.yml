name: CI

on:
  push:
    # `claude/gis-maps-pack` is here because the maps pack is developed on it over
    # weeks and merged into repeatedly, so its head needs checking on its own
    # account. Today that only happens as a side effect of PR #89 being open: a
    # `pull_request` run checks that PR's head, which IS this branch. #89 exists to
    # be closed rather than merged, and the day it closes the branch would lose its
    # coverage with nothing to say so. A branch that is merged into should not
    # depend on a pull request nobody intends to merge.
    branches: [main, claude/gis-maps-pack]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The log this step writes cannot be read by the sessions that drive this pack:
      # the Actions log endpoint redirects to blob storage their egress policy denies,
      # and the check annotation a bare failure leaves behind is the single line
      # "Process completed with exit code 1". A red leg on one matrix entry and green on
      # the other two is then indistinguishable from a flake, which cost an afternoon.
      # Annotations they CAN read, so the same digest the release workflow's gates step
      # uses goes here - `--pytest` because `-q` ends in a wall of SKIPPED reasons and a
      # blind tail names which maps opted out of which contract, never the assertion.
      - name: Run test suite
        shell: bash
        run: |
          set +e
          set -uo pipefail
          python -m pytest -q 2>&1 | tee /tmp/suite.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "--- stage: test suite, Python ${{ matrix.python-version }}" > /tmp/suite.env
            python .github/scripts/build_failure_annotation.py \
              "$status" /tmp/suite.log /tmp/suite.env --pytest \
              --title "Test suite failed on Python ${{ matrix.python-version }}"
            exit "$status"
          fi

      - name: Smoke-test command entry point
        run: python -m beamng_mcp --help

  quality-and-build:
    name: Quality and distributions
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Verify dependency lockfile
        run: uv lock --check

      - name: Install quality and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Type-check
        run: python -m mypy src/beamng_mcp

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Clean-install and smoke-test wheel
        shell: pwsh
        run: |
          python -m venv .wheel-smoke
          $wheel = (Get-ChildItem -Path dist -Filter *.whl | Select-Object -First 1).FullName
          .\.wheel-smoke\Scripts\python.exe -m pip install $wheel
          .\.wheel-smoke\Scripts\beamng-mcp.exe --version
          .\.wheel-smoke\Scripts\beamng-mcp.exe install-lua --user .\.wheel-smoke\beamng-user

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
