[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "beamng-mcp"
version = "0.3.0"
description = "A safety-gated MCP control plane for BeamNG.drive and BeamNG.tech"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Eric Rolph" }]
keywords = ["beamng", "mcp", "autonomous-driving", "simulation", "beamngpy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "anyio>=4.8,<5",
  "beamngpy>=1.35.1,<1.36",
  "mcp[cli]>=1.28.1,<2",
  "numpy>=1.26,<3",
  "pillow>=11.3,<13",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "websockets>=16.1,<17",
]

[project.optional-dependencies]
vision = [
  "opencv-python-headless>=4.11,<5",
  "onnxruntime-gpu>=1.22,<1.27",
  "torch>=2.8,<3",
  "transformers>=4.53,<5",
]
dev = [
  # The giant_props headless gates run each mod's REAL generated runtime.lua
  # under lupa, and the Spin Launch audio gate hashes DECODED PCM through
  # soundfile. Both were undeclared, and both are guarded by
  # `pytest.importorskip` - so on a clean `pip install -e .[dev]` they did not
  # fail, they SKIPPED: 135 of Spin Launch's 162 tests evaporated silently,
  # and eleven test modules across the pack lost their lupa rig. A dependency
  # that only the author happens to have installed is a gate that only runs on
  # the author's machine.
  "lupa>=2.8,<3",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  # Pinned to a formatter-stable minor: the format gate is only meaningful
  # when CI and every workstation resolve the SAME formatter. The open
  # `<1` pin let CI pick up 0.16 the day it shipped, and its restyled
  # output failed `format --check` on two dozen files authored under
  # 0.15 that no commit had touched.
  "ruff>=0.15,<0.16",
  "soundfile>=0.14,<1",
]

[project.urls]
Homepage = "https://github.com/eric-rolph/beamng-mcp"
Documentation = "https://github.com/eric-rolph/beamng-mcp/tree/main/docs"
Issues = "https://github.com/eric-rolph/beamng-mcp/issues"
Source = "https://github.com/eric-rolph/beamng-mcp"

[project.scripts]
beamng-mcp = "beamng_mcp.cli:main"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/beamng_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/.env.example",
  "/server.json",
  "/beamng-mcp.example.toml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "blender: opt-in tests that execute a configured local Blender binary",
  "beamng_live: opt-in tests that launch BeamNG against an isolated user directory",
  "beamng_gpu: opt-in tests that require BeamNG GPU rendering",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# The Giant Props pack is a rapidly-iterating art/mod workstream: Blender
# generators, procedural texture families, and Lua-in-string specs, guarded
# by its own ~550-test structural suite (tests/test_giant_props_*). Holding
# its checkpoint commits to server-grade lint/format blocked CI on hundreds
# of cosmetic findings, so ruff (lint AND format) skips the pack tree; the
# server (src/) and the shared test suite stay fully linted.
extend-exclude = ["examples/giant_props"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# S314: the suite parses XML (Collada DAEs, materials) that this repository
# itself generated moments earlier - there is no untrusted XML input here.
"tests/**/*.py" = ["S101", "S105", "S106", "S314"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["beamng_mcp"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["cv2", "onnxruntime", "torch", "transformers", "transformers.*"]
ignore_missing_imports = true
